<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komandiruotės skaičiuoklė – Go Vilnius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:      #D42B2B;
  --red-dark: #A81F1F;
  --red-light:#FDEAEA;
  --yellow:   #F5C500;
  --yellow-bg:#FFFBEA;
  --dark:     #1A1A1A;
  --text:     #222222;
  --muted:    #707070;
  --border:   #E2E2E2;
  --bg:       #F7F7F5;
  --surface:  #FFFFFF;
  --radius:   10px;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 32px 16px 56px;
  color: var(--text);
}

.card {
  max-width: 540px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: 0 2px 32px rgba(0,0,0,.09);
  overflow: hidden;
}

/* ── Header ───────────────────────────────── */
.header {
  background: var(--dark);
  padding: 20px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo-wrap img {
  height: 40px;
  display: block;
  object-fit: contain;
}

.header-badge {
  background: var(--yellow);
  color: var(--dark);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ── Title bar ────────────────────────────── */
.titlebar {
  background: var(--red);
  padding: 16px 28px;
}

.titlebar h1 {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -.1px;
}

.titlebar p {
  font-size: 12px;
  color: rgba(255,255,255,.70);
  margin-top: 3px;
}

/* ── Body ─────────────────────────────────── */
.body {
  padding: 24px 28px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── Section ──────────────────────────────── */
.section {
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: visible;
}

.section-head {
  background: var(--bg);
  padding: 9px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  gap: 7px;
}

.section-body {
  padding: 14px 16px 16px;
  background: var(--surface);
  overflow: visible;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ── Field ────────────────────────────────── */
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
}

.field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ── Time Input ───────────────────────────── */
.time-input {
  font-family: 'DM Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  width: 100%;
  letter-spacing: 3px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}

.time-input::placeholder {
  color: #CACACA;
  letter-spacing: 1px;
  font-size: 17px;
}

.time-input:focus {
  outline: none;
  border-color: var(--red);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(212,43,43,.11);
}

.time-input.invalid {
  border-color: #E0A800;
  background: var(--yellow-bg);
}

.time-input.valid {
  border-color: #43A047;
  background: #F2FBF2;
}

.hint {
  font-size: 11px;
  color: #ABABAB;
  margin-top: 6px;
  font-weight: 500;
}

.country-input {
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  width: 100%;
  transition: border-color .15s, box-shadow .15s, background .15s;
}

.country-input:focus {
  outline: none;
  border-color: var(--red);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(212,43,43,.11);
}

.country-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
  z-index: 30;
  display: none;
}

.country-menu.visible { display: block; }

.country-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 14px;
}

.country-option:hover { background: #f6f6f6; }

.country-option img {
  width: 18px;
  height: 13px;
  object-fit: cover;
  border: 1px solid #ddd;
}

/* ── Number input ─────────────────────────── */
.num-input {
  font-family: 'DM Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  width: 100%;
  transition: border-color .15s, box-shadow .15s, background .15s;
  appearance: textfield;
  -moz-appearance: textfield;
}
.num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.num-input:focus {
  outline: none;
  border-color: var(--red);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(212,43,43,.11);
}

/* ── Button ───────────────────────────────── */
.btn {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .2px;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn:hover  { background: var(--red-dark); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

/* ── Error ────────────────────────────────── */
.error {
  display: none;
  background: var(--yellow-bg);
  border: 1.5px solid var(--yellow);
  color: #7A5800;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
}
.error.visible { display: block; }

/* ── Result ───────────────────────────────── */
.result {
  display: none;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.result.visible { display: block; }

.result-head {
  background: var(--dark);
  color: #fff;
  padding: 11px 18px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
}

.result-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.r-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg);
  border-radius: 8px;
  gap: 10px;
}

.r-row .r-label { font-size: 13.5px; font-weight: 500; color: var(--text); }
.r-row .r-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
.r-row .r-val   { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 600; color: var(--red); white-space: nowrap; }

.divider { height: 1px; background: var(--border); }

.r-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 16px;
  background: var(--red);
  border-radius: 8px;
}

.r-total .r-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: .5px; }
.r-total .r-val   { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 700; color: #fff; }

.note {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.65;
  padding: 11px 14px;
  background: var(--yellow-bg);
  border-radius: 8px;
  border-left: 3px solid var(--yellow);
}
</style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="logo-wrap">
      <img src="https://images.squarespace-cdn.com/content/v1/677da96c31d9771021fee2a7/cea1a0d8-c8e0-4819-b398-be1ea28d5479/Go+Vilnius+Logo.png" alt="Go Vilnius">
    </div>
  </div>

  <div class="titlebar">
    <h1>Komandiruotės skaičiuoklė</h1>

  </div>

  <div class="body">

    <div class="section">
      <div class="section-head">✈︎ Skrydis į priekį</div>
      <div class="section-body">
        <div class="row">
          <div class="field">
            <label>Išvykimas</label>
            <input class="time-input" type="text" id="depForward" placeholder="HH:MM" maxlength="5" autocomplete="off" inputmode="numeric">
          </div>
          <div class="field">
            <label>Atvykimas</label>
            <input class="time-input" type="text" id="arrForward" placeholder="HH:MM" maxlength="5" autocomplete="off" inputmode="numeric">
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="field">
            <label>Iš šalies</label>
            <input class="country-input" type="text" id="fromForward" placeholder="Ieškoti šalies..." autocomplete="off">
            <div class="country-menu" id="fromForwardMenu"></div>
          </div>
          <div class="field">
            <label>Į šalį</label>
            <input class="country-input" type="text" id="toForward" placeholder="Ieškoti šalies..." autocomplete="off">
            <div class="country-menu" id="toForwardMenu"></div>
          </div>
        </div>
        <div class="hint">24 val. formatas, pvz.&nbsp; 06:45 &nbsp;/&nbsp; 22:30</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><span style="display:inline-block; transform: scaleX(-1);">✈︎</span> Skrydis atgal</div>
      <div class="section-body">
        <div class="row">
          <div class="field">
            <label>Išvykimas</label>
            <input class="time-input" type="text" id="depBack" placeholder="HH:MM" maxlength="5" autocomplete="off" inputmode="numeric">
          </div>
          <div class="field">
            <label>Atvykimas</label>
            <input class="time-input" type="text" id="arrBack" placeholder="HH:MM" maxlength="5" autocomplete="off" inputmode="numeric">
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="field">
            <label>Iš šalies</label>
            <input class="country-input" type="text" id="fromBack" placeholder="Ieškoti šalies..." autocomplete="off">
            <div class="country-menu" id="fromBackMenu"></div>
          </div>
          <div class="field">
            <label>Į šalį</label>
            <input class="country-input" type="text" id="toBack" placeholder="Ieškoti šalies..." autocomplete="off">
            <div class="country-menu" id="toBackMenu"></div>
          </div>
        </div>
        <div class="hint">24 val. formatas, pvz.&nbsp; 18:00 &nbsp;/&nbsp; 23:55</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">⏱ Papildomos valandos</div>
      <div class="section-body">
        <div style="max-width:180px">
          <div class="field">
            <label>Viršvalandžiai (val.)</label>
            <input class="num-input" type="number" id="extra" value="0" min="0" step="0.5">
          </div>
        </div>
      </div>
    </div>

    <button class="btn" id="calcBtn">Skaičiuoti</button>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-head">📋 Rezultatas – įrašyti į sistemą</div>
      <div class="result-body" id="resultBody"></div>
    </div>

  </div>
</div>

<script>
(function () {
  function byId(id) {
    return document.getElementById(id);
  }

  const REGION_CODES = [
    'AD','AE','AF','AG','AI','AL','AM','AO','AQ','AR','AS','AT','AU','AW','AX','AZ','BA','BB','BD','BE','BF','BG','BH','BI','BJ','BL','BM','BN','BO','BQ','BR','BS','BT','BV','BW','BY','BZ','CA','CC','CD','CF','CG','CH','CI','CK','CL','CM','CN','CO','CR','CU','CV','CW','CX','CY','CZ','DE','DJ','DK','DM','DO','DZ','EC','EE','EG','EH','ER','ES','ET','FI','FJ','FK','FM','FO','FR','GA','GB','GD','GE','GF','GG','GH','GI','GL','GM','GN','GP','GQ','GR','GS','GT','GU','GW','GY','HK','HM','HN','HR','HT','HU','ID','IE','IL','IM','IN','IO','IQ','IR','IS','IT','JE','JM','JO','JP','KE','KG','KH','KI','KM','KN','KP','KR','KW','KY','KZ','LA','LB','LC','LI','LK','LR','LS','LT','LU','LV','LY','MA','MC','MD','ME','MF','MG','MH','MK','ML','MM','MN','MO','MP','MQ','MR','MS','MT','MU','MV','MW','MX','MY','MZ','NA','NC','NE','NF','NG','NI','NL','NO','NP','NR','NU','NZ','OM','PA','PE','PF','PG','PH','PK','PL','PM','PN','PR','PS','PT','PW','PY','QA','RE','RO','RS','RU','RW','SA','SB','SC','SD','SE','SG','SH','SI','SJ','SK','SL','SM','SN','SO','SR','SS','ST','SV','SX','SY','SZ','TC','TD','TF','TG','TH','TJ','TK','TL','TM','TN','TO','TR','TT','TV','TW','TZ','UA','UG','UM','US','UY','UZ','VA','VC','VE','VG','VI','VN','VU','WF','WS','YE','YT','ZA','ZM','ZW'
  ];

  const countryDisplayLt = (typeof Intl !== 'undefined' && Intl.DisplayNames)
    ? new Intl.DisplayNames(['lt'], { type: 'region' })
    : null;
  const countryDisplayEn = (typeof Intl !== 'undefined' && Intl.DisplayNames)
    ? new Intl.DisplayNames(['en'], { type: 'region' })
    : null;

  function flagFromCode(code) {
    return String.fromCodePoint(code.charCodeAt(0) + 127397, code.charCodeAt(1) + 127397);
  }

  function countryNameFromCode(code) {
    const ltName = countryDisplayLt ? countryDisplayLt.of(code) : '';
    if (ltName && ltName !== code) return ltName;
    const enName = countryDisplayEn ? countryDisplayEn.of(code) : '';
    if (enName && enName !== code) return enName;
    return 'Salis';
  }

  const COUNTRY_OPTIONS = REGION_CODES.map(function (code) {
    const name = countryNameFromCode(code);
    return {
      code: code,
      name: name,
      value: flagFromCode(code) + ' ' + name,
      flagUrl: 'https://flagcdn.com/w40/' + code.toLowerCase() + '.png'
    };
  }).sort(function (a, b) {
    return a.value.localeCompare(b.value, 'lt');
  });
  const COUNTRY_VALUES = COUNTRY_OPTIONS.map(function (c) { return c.value; });
  const COUNTRY_CODE_BY_VALUE = COUNTRY_OPTIONS.reduce(function (acc, c) {
    acc[c.value] = c.code;
    return acc;
  }, {});
  const COUNTRY_UTC_OFFSET_MINUTES = {"BG":120,"SI":60,"CZ":60,"GD":-240,"GB":0,"AG":-240,"NL":60,"TD":60,"KZ":360,"AU":660,"GN":0,"TC":-300,"KI":780,"TT":-240,"RO":120,"PL":60,"HM":300,"AD":60,"DO":-240,"BV":60,"CI":0,"TH":420,"KH":420,"IE":0,"SE":60,"IL":120,"TG":0,"VA":60,"SL":0,"AS":-660,"MW":120,"NR":720,"GG":0,"AF":270,"KE":180,"HU":60,"LT":120,"GL":0,"KR":540,"VC":-240,"MA":60,"CX":420,"FR":60,"AW":-240,"MC":60,"XK":60,"TV":720,"LR":0,"KG":360,"TJ":300,"MT":60,"WF":720,"CW":-240,"EG":120,"PG":660,"EE":120,"VG":-240,"JO":120,"DK":60,"SY":120,"KW":180,"BR":-180,"PF":-540,"LA":420,"CF":60,"GP":-240,"BZ":-360,"YE":180,"MR":0,"MP":600,"MV":300,"WS":840,"GR":120,"TF":300,"TL":540,"IN":330,"PM":-180,"NP":345,"FO":0,"PT":-60,"AT":60,"MO":480,"AL":60,"PE":-300,"GF":-180,"HR":60,"DE":60,"SC":240,"LC":-240,"MG":180,"AI":-240,"MQ":-240,"CK":-600,"IR":210,"MN":480,"GH":0,"BW":120,"MS":-240,"NC":660,"BI":120,"FJ":720,"GA":60,"EH":60,"SO":180,"ES":60,"LI":60,"MZ":120,"NU":-660,"PW":540,"CL":-180,"CC":390,"SR":-180,"HN":-360,"SV":-360,"CD":60,"GU":600,"BA":60,"GQ":60,"BO":-240,"AM":240,"PH":480,"CU":-300,"SB":660,"MU":240,"AQ":660,"JE":0,"IS":0,"BE":60,"AE":240,"MM":390,"SH":0,"GS":-120,"NG":60,"KP":540,"PR":-240,"TZ":180,"DM":-240,"VN":420,"YT":180,"NE":60,"EC":-300,"LK":330,"IM":0,"VE":-240,"SD":120,"PK":300,"JP":540,"SX":-240,"GE":240,"CV":-60,"AX":120,"GM":0,"MH":720,"IO":360,"QA":180,"UM":-660,"BY":180,"PY":-180,"TN":60,"SN":0,"HT":-300,"PA":-300,"UG":180,"UZ":300,"VI":-240,"ID":420,"LU":60,"NA":120,"UA":120,"IT":60,"ET":180,"LY":120,"NI":-360,"MK":60,"RU":720,"GT":-360,"OM":240,"GW":0,"SJ":60,"UY":-180,"GY":-240,"ZA":120,"LV":120,"GI":60,"TK":780,"SK":60,"LS":120,"BN":480,"MD":120,"BM":-240,"RE":240,"HK":480,"TO":780,"ML":0,"MX":-360,"CG":60,"BT":360,"AZ":240,"ST":0,"BS":-300,"AR":-180,"KM":180,"BF":0,"SZ":120,"CO":-300,"BB":-240,"CA":-300,"NF":720,"DJ":180,"CR":-360,"MY":480,"KN":-240,"KY":-300,"ZM":120,"CH":60,"BD":360,"BQ":-240,"TR":180,"TM":300,"RW":120,"VU":660,"ME":60,"IQ":180,"FI":120,"SG":480,"NZ":780,"SA":180,"LB":120,"JM":-300,"ER":180,"MF":-240,"TW":480,"SS":180,"FM":600,"CY":120,"PN":-480,"SM":60,"BH":180,"BJ":60,"FK":-180,"US":-600,"CN":480,"ZW":120,"CM":60,"BL":-240,"DZ":60,"AO":60,"NO":60,"PS":120,"RS":60};

  function setupCountryAutocomplete(inputId, menuId) {
    const input = byId(inputId);
    const menu = byId(menuId);
    if (!input || !menu) return;

    function hideMenu() { menu.classList.remove('visible'); }

    function renderOptions() {
      const q = input.value.trim().toLowerCase();
      const opts = COUNTRY_OPTIONS.filter(function (c) {
        return !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q);
      }).slice(0, 60);
      menu.innerHTML = opts.map(function (c) {
        return '<div class="country-option" data-value="' + c.value + '">' +
          '<img src="' + c.flagUrl + '" alt="' + c.code + '">' +
          '<span>' + c.value + '</span>' +
        '</div>';
      }).join('');
      menu.classList.toggle('visible', opts.length > 0);
    }

    input.addEventListener('focus', renderOptions);
    input.addEventListener('input', renderOptions);
    menu.addEventListener('mousedown', function (e) {
      const opt = e.target.closest('.country-option');
      if (!opt) return;
      input.value = opt.getAttribute('data-value') || '';
      hideMenu();
      input.dispatchEvent(new Event('change'));
      e.preventDefault();
    });
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && e.target !== input) hideMenu();
    });
  }

  // ── Time input: digit-by-digit validation + auto-colon ──────────────────
  //
  // Strategy: work only on raw digits (strip the colon), validate each
  // digit position, then re-inject the colon after digit #2.
  // The keydown handler blocks impossible first keystrokes; the input
  // handler re-validates after EVERY change (paste, mobile, autofill…).

  function applyFormat(input) {
    if (!input) return;
    // Extract only digits, cap at 4
    let raw = input.value.replace(/\D/g, '').slice(0, 4);

    // Walk digit-by-digit and drop the first invalid digit (and everything after it)
    let valid = '';
    for (let i = 0; i < raw.length; i++) {
      const d = parseInt(raw[i]);
      if (i === 0 && d > 2)                          break; // H1: 0–2
      if (i === 1 && parseInt(valid[0]) === 2 && d > 3) break; // H2: if H1=2 → 0–3
      if (i === 2 && d > 5)                          break; // M1: 0–5
      // M2 (i===3): 0–9, always ok
      valid += raw[i];
    }

    // Insert colon after 2 digits
    const formatted = valid.length <= 2 ? valid : valid.slice(0, 2) + ':' + valid.slice(2);

    if (input.value !== formatted) {
      // Preserve cursor position across the colon insertion
      const sel = typeof input.selectionStart === 'number' ? input.selectionStart : formatted.length;
      input.value = formatted;
      // If we just inserted the colon (length crossed from 2→3), push cursor past it
      const newSel = (formatted.length === 3 && sel === 2) ? 3 : Math.min(sel, formatted.length);
      try { input.setSelectionRange(newSel, newSel); } catch (_) {}
    }

    validateField(input);
  }

  function setupTimeInput(input) {
    if (!input) return;
    // beforeinput: most reliable cross-browser/mobile block — fires before DOM changes
    input.addEventListener('beforeinput', function (e) {
      if (!e.data) return; // deletions, selections — let through
      if (/\D/.test(e.data)) { e.preventDefault(); } // block any non-digit character
    });

    // keydown: additional guard for desktop + Backspace colon-skip
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace') {
        if (this.selectionStart === 3 && this.selectionEnd === 3) {
          this.value = this.value.slice(0, 2) + this.value.slice(3);
          e.preventDefault();
          validateField(this);
        }
        return;
      }
      if (['Delete','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)) return;
      if (e.ctrlKey || e.metaKey) return;
      if (!/^\d$/.test(e.key)) { e.preventDefault(); }
    });

    // input: safety net — strips anything non-digit that still got through (paste, autofill)
    input.addEventListener('input', function () { applyFormat(this); });

    // blur: auto-complete "23" → "23:00" so single-segment entries work
    input.addEventListener('blur', function () {
      const raw = this.value.replace(/\D/g, '');
      if (raw.length === 2) {
        this.value = raw + ':00';
      }
      validateField(this);
    });
  }

  function isValidTime(v) {
    if (!/^\d{2}:\d{2}$/.test(v)) return false;
    const [h, m] = v.split(':').map(Number);
    return h <= 23 && m <= 59;
  }

  function validateField(input) {
    if (!input) return;
    const v = input.value;
    if (!v) { input.classList.remove('valid', 'invalid'); return; }
    const ok = isValidTime(v);
    input.classList.toggle('valid',   ok);
    input.classList.toggle('invalid', !ok);
  }

  // ── Calculation ─────────────────────────────────────────────────────────
  function calcSegment(dep, arr, depTz, arrTz) {
    const [depH, depM] = dep.split(':').map(Number);
    const [arrH, arrM] = arr.split(':').map(Number);
    let depTotal = depH * 60 + depM;
    let arrTotal = arrH * 60 + arrM;
    let duration = arrTotal - depTotal + (depTz - arrTz);
    let crossesMidnight = false;

    while (duration <= 0) duration += 24 * 60;
    while (duration > 24 * 60) duration -= 24 * 60;

    arrTotal = depTotal + duration;
    if (arrTotal >= 24 * 60) crossesMidnight = true;

    let paid = 0;
    for (let t = depTotal; t < arrTotal; t++) {
      const h = Math.floor((t % (24 * 60)) / 60);
      if (h < 6 || h >= 22) paid++;
    }

    const arrHr = Math.floor((arrTotal % (24 * 60)) / 60);
    if (arrHr >= 22 || arrHr < 6) paid += 60;

    return { hours: paid / 60, crossesMidnight };
  }

  function calc() {
    const depForward = byId('depForward');
    const arrForward = byId('arrForward');
    const depBack = byId('depBack');
    const arrBack = byId('arrBack');
    const fromForward = byId('fromForward');
    const toForward = byId('toForward');
    const fromBack = byId('fromBack');
    const toBack = byId('toBack');
    const extraEl = byId('extra');
    const errEl = byId('error');
    const resEl = byId('result');
    const resultBody = byId('resultBody');

    if (!depForward || !arrForward || !depBack || !arrBack || !fromForward || !toForward || !fromBack || !toBack || !extraEl || !errEl || !resEl || !resultBody) return;

    // Final safety net: sanitize all values right before calculation.
    [depForward, arrForward, depBack, arrBack].forEach(applyFormat);

    const df = depForward.value.trim();
    const af = arrForward.value.trim();
    const db = depBack.value.trim();
    const ab = arrBack.value.trim();
    const cff = fromForward.value.trim();
    const ctf = toForward.value.trim();
    const cfb = fromBack.value.trim();
    const ctb = toBack.value.trim();
    const extra = Math.max(0, parseFloat(String(extraEl.value).replace(',', '.')) || 0);

    if (![df,af,db,ab,cff,ctf,cfb,ctb].every(function(v){return v;})) {
      errEl.textContent = '⚠️ Prašome užpildyti visus laukus (laikai ir šalys).';
      errEl.classList.add('visible'); resEl.classList.remove('visible'); return;
    }
    if (![df,af,db,ab].every(isValidTime)) {
      errEl.textContent = '⚠️ Neteisingas formatas – patikrinkite įvestas reikšmes.';
      errEl.classList.add('visible'); resEl.classList.remove('visible'); return;
    }
    if (![cff,ctf,cfb,ctb].every(function (v) { return COUNTRY_VALUES.includes(v); })) {
      errEl.textContent = '⚠️ Šalį pasirinkite iš sąrašo (vėliavėlė + pavadinimas).';
      errEl.classList.add('visible'); resEl.classList.remove('visible'); return;
    }
    const fromForwardCode = COUNTRY_CODE_BY_VALUE[cff];
    const toForwardCode = COUNTRY_CODE_BY_VALUE[ctf];
    const fromBackCode = COUNTRY_CODE_BY_VALUE[cfb];
    const toBackCode = COUNTRY_CODE_BY_VALUE[ctb];
    const depFOffset = COUNTRY_UTC_OFFSET_MINUTES[fromForwardCode];
    const arrFOffset = COUNTRY_UTC_OFFSET_MINUTES[toForwardCode];
    const depBOffset = COUNTRY_UTC_OFFSET_MINUTES[fromBackCode];
    const arrBOffset = COUNTRY_UTC_OFFSET_MINUTES[toBackCode];
    if ([depFOffset, arrFOffset, depBOffset, arrBOffset].some(function (v) { return typeof v !== 'number'; })) {
      errEl.textContent = '⚠️ Nepavyko nustatyti UTC pagal pasirinktą šalį.';
      errEl.classList.add('visible'); resEl.classList.remove('visible'); return;
    }

    errEl.classList.remove('visible');
    const f = calcSegment(df, af, depFOffset, arrFOffset);
    const b = calcSegment(db, ab, depBOffset, arrBOffset);
    const total = f.hours + b.hours + extra;

    resultBody.innerHTML =
      '<div class="r-row">' +
        '<div>' +
          '<div class="r-label">✈︎ Skrydis į priekį</div>' +
          '<div class="r-sub">' + cff + ' → ' + ctf + '</div>' +
          '<div class="r-sub">' + df + ' (UTC' + (depFOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(depFOffset) / 60)).padStart(2, '0') + ':' + String(Math.abs(depFOffset) % 60).padStart(2, '0') + ') → ' + af + ' (UTC' + (arrFOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(arrFOffset) / 60)).padStart(2, '0') + ':' + String(Math.abs(arrFOffset) % 60).padStart(2, '0') + ')' + (f.crossesMidnight ? ' (+1 d.)' : '') + '</div>' +
        '</div>' +
        '<div class="r-val">' + f.hours.toFixed(2) + ' val.</div>' +
      '</div>' +
      '<div class="r-row">' +
        '<div>' +
          '<div class="r-label"><span style="display:inline-block;transform:scaleX(-1)">✈︎</span> Skrydis atgal</div>' +
          '<div class="r-sub">' + cfb + ' → ' + ctb + '</div>' +
          '<div class="r-sub">' + db + ' (UTC' + (depBOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(depBOffset) / 60)).padStart(2, '0') + ':' + String(Math.abs(depBOffset) % 60).padStart(2, '0') + ') → ' + ab + ' (UTC' + (arrBOffset >= 0 ? '+' : '-') + String(Math.floor(Math.abs(arrBOffset) / 60)).padStart(2, '0') + ':' + String(Math.abs(arrBOffset) % 60).padStart(2, '0') + ')' + (b.crossesMidnight ? ' (+1 d.)' : '') + '</div>' +
        '</div>' +
        '<div class="r-val">' + b.hours.toFixed(2) + ' val.</div>' +
      '</div>' +
      (extra > 0
        ? '<div class="r-row"><div><div class="r-label">⏱ Viršvalandžiai</div></div><div class="r-val">+' + extra.toFixed(2) + ' val.</div></div>'
        : '') +
      '<div class="divider"></div>' +
      '<div class="r-total">' +
        '<span class="r-label">Iš viso</span>' +
        '<span class="r-val">' + total.toFixed(2) + ' val.</span>' +
      '</div>' +
      '<div class="note">Skaičiuojamos <strong>nakties valandos</strong>: 22:00–06:00.<br>Skrydžio trukmė perskaičiuojama pagal UTC skirtumą tarp išvykimo ir atvykimo vietų.</div>';

    resEl.classList.add('visible');
    resEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function init() {
    setupCountryAutocomplete('fromForward', 'fromForwardMenu');
    setupCountryAutocomplete('toForward', 'toForwardMenu');
    setupCountryAutocomplete('fromBack', 'fromBackMenu');
    setupCountryAutocomplete('toBack', 'toBackMenu');
    ['depForward','arrForward','depBack','arrBack'].forEach(function (id) {
      setupTimeInput(byId(id));
    });
    const calcBtn = byId('calcBtn');
    if (calcBtn) calcBtn.addEventListener('click', calc);
  }

  // SharePoint preview/embed may alter script execution timing.
  // Initialize safely regardless of where/when this script runs.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
